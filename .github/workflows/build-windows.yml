name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (uses package.json by default)'
        required: false
        type: string

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          TAURI_SIGNING_SKIP: "true"
        run: npm run tauri build

      - name: Upload MSI installer
        uses: actions/upload-artifact@v5
        with:
          name: todolist-windows-installer
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload NSIS installer
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: todolist-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: ignore

      - name: List build artifacts
        if: always()
        run: |
          Write-Host "=== Build Artifacts ==="
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | ForEach-Object {
            Write-Host "$($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)"
          }
