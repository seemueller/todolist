name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (uses package.json by default)'
        required: false
        type: string

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          # WebView2 for Tauri on Windows
          if (-not (Test-Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}")) {
            Write-Host "Installing WebView2..."
            $webview2Installer = "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
            Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $webview2Installer
            Start-Process -FilePath $webview2Installer -ArgumentList "/silent", "/install" -Wait
          }

      - name: Build Tauri app
        env:
          TAURI_SIGNING_SKIP: "true"
        run: npm run tauri build

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: todolist-windows-installer
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload NSIS installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todolist-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: ignore

      - name: List build artifacts
        if: always()
        run: |
          Write-Host "=== Build Artifacts ==="
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | ForEach-Object {
            Write-Host "$($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)"
          }
