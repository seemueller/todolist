name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (uses package.json by default)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows & Release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Get app version
        id: version
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { (Get-Content package.json | ConvertFrom-Json).version }
          echo "version=$version" >> $env:GITHUB_OUTPUT
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Generate updater signing key
        if: ${{ !env.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $password = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          if (-not $password) { Write-Error "TAURI_KEY_PASSWORD secret not set"; exit 1 }
          $output = echo $password | npx @tauri-apps/cli signer generate
          $pubkeyLine = $output | Select-String "Public:"
          if (-not $pubkeyLine) { Write-Error "Could not find Public key in signer output"; exit 1 }
          $pubkey = $pubkeyLine.Line.Substring("Public:".Length).Trim()
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $config.plugins.updater.pubkey = $pubkey
          $config | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json"
          Write-Host "::notice::Updated tauri.conf.json with public key. Save TAURI_PRIVATE_KEY as a GitHub secret for future runs."
        continue-on-error: true

      - name: Build Tauri app
        run: npm run tauri build

      - name: Create draft release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" --draft --title "v${{ steps.version.outputs.version }}"
          $releaseId = gh release view "v${{ steps.version.outputs.version }}" --json id --jq '.id'
          echo "RELEASE_ID=$releaseId" >> $env:GITHUB_ENV

      - name: Generate latest.json
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $repo = "seemueller/roomote-test-todolist"
          $baseUrl = "https://github.com/$repo/releases/download/v$version"

          $nsisFile = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $nsisSig = Get-Content "$($nsisFile.DirectoryName)/$($nsisFile.BaseName).exe.sig" -Raw

          $manifest = @{
            version = "v$version"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                url = "$baseUrl/$($nsisFile.Name)"
                signature = $nsisSig.Trim()
              }
            }
          } | ConvertTo-Json -Depth 10

          $manifest | Out-File -FilePath "latest.json" -Encoding utf8
          Write-Host "Generated latest.json:"
          Get-Content "latest.json"

      - name: Upload artifacts to release
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | ForEach-Object {
            gh release upload "v$version" $_.FullName --clobber
          }
          gh release upload "v$version" latest.json --clobber

      - name: Publish release
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release edit "v$version" --latest

      - name: List build artifacts
        if: always()
        run: |
          Write-Host "=== Build Artifacts ==="
          if (Test-Path "src-tauri/target/release/bundle") {
            Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | ForEach-Object {
              Write-Host "$($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)"
            }
          } else {
            Write-Host "No build artifacts found."
          }
