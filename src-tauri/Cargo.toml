[package]
name = "todolist"
version = "0.7.0"
description = "A simple desktop TODO list application"
authors = ["seemueller"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
# MCP-Server: rmcp bringt keinen eigenen Listener mit, der StreamableHttpService
# wird in einen axum-Router gehaengt. Das `local`-Feature von rmcp bleibt bewusst
# aus -- es kompiliert genau das `tower`-Submodul weg, auf dem das beruht.
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "time"] }
tokio-util = "0.7"
subtle = "2"
rand = "0.9"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

